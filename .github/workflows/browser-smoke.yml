name: Browser smoke

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/browserSmoke.cjs"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/browser-smoke.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/browserSmoke.cjs"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/browser-smoke.yml"

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install pinned browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/browserSmoke.cjs
