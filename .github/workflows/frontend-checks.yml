name: Frontend checks

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/frontend-checks.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/frontend-checks.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Dependency audit (report only)
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a = require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) { console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:v.via,fixAvailable:v.fixAvailable,effects:v.effects,nodes:v.nodes})); } console.log('TOTALS', JSON.stringify(a.metadata?.vulnerabilities || {}));"
      - run: npm test
      - run: npm run build
